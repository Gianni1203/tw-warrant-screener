name: 更新權證資料

on:
  schedule:
    # 週一到週五 台灣時間 17:40（UTC 09:40），等交易所盤後資料出齊
    - cron: "40 9 * * 1-5"
  workflow_dispatch:   # 可在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓資料並計算
        run: python scripts/fetch_warrants.py

      - name: 有變動才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/warrants.json
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
